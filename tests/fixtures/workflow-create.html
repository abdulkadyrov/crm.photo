<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создание задач — проверка</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../../css/workflow-tasks.css"><style>body{padding:16px}main{max-width:700px;margin:auto}#status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}h1{font-size:24px}</style><main><h1>Задачи</h1><button class="wt-button wt-button--primary" id="create">Создать задачу</button><p>Проверка: проект → группа → ребёнок → задача.</p><div id="status" role="status"></div></main><script type="module">
import {openWorkflowTaskCreate} from '../../js/ui/workflow-task-create.js';
import {createWorkflowTaskStore} from '../../js/services/workflow-task-store.js';
import {deriveWorkflowTasks} from '../../js/services/workflow-tasks.js';
const data={projects:[{id:'school',name:'Школа № 5'},{id:'kindergarten',name:'Детский сад «Улыбка» — подготовительные группы'},{id:'empty',name:'Новый проект'}],classes:[{id:'g',projectId:'school',name:'3а'},{id:'g2',projectId:'school',name:'Подготовительная группа с длинным названием'}],students:[{id:'child',classId:'g',firstName:'Алина',lastName:'Смирнова'},{id:'child2',classId:'g',firstName:'Мария',lastName:'Иванова'}]};
const store=createWorkflowTaskStore({account:()=>({id:'task-create-local-fixture',role:'admin'}),enabled:false,onChange:show});
function show(){const rows=deriveWorkflowTasks(data,{role:'admin',overrides:store.snapshot().overrides});document.querySelector('#status').textContent=rows.length?rows.map(t=>`${t.title} · ${t.projectName} · ${t.className} · ${t.studentName} · ${t.dueAt||'Без срока'} · ${t.reason}`).join('\n'):'Задач пока нет';}
document.querySelector('#create').onclick=()=>openWorkflowTaskCreate({data,onClose:show,onSave:async({target,values,serviceId})=>{await store.update({projectId:target.projectId,studentId:target.studentId||'project_'+target.projectId,serviceId},{...values,entityKind:target.studentId?'student':'project',classId:target.classId,requestedAt:new Date().toISOString(),completedAt:''});}});show();
</script></html>
