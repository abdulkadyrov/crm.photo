<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Камера для Mac</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font:16px system-ui,-apple-system,sans-serif}main{max-width:650px;min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}h1{font-size:22px;margin:0}p{margin:0;line-height:1.4}label{display:block;font-size:14px}input,button,select{font:inherit;border-radius:12px;min-height:46px;width:100%;padding:10px 12px}input,select{border:1px solid #64748b;background:#1e293b;color:#fff}button{border:0;background:#2563eb;color:#fff;font-weight:650;cursor:pointer}button:disabled{opacity:.55}form{display:grid;gap:10px}input{font-size:28px;text-align:center;letter-spacing:.15em}.viewfinder{position:relative;flex:1;min-height:280px;border-radius:14px;overflow:hidden;background:#020617}.viewfinder video{width:100%;height:100%;position:absolute;inset:0;object-fit:contain}.aim{position:absolute;width:64%;aspect-ratio:1;max-height:80%;border:2px solid #fff;border-radius:16px;left:18%;top:50%;transform:translateY(-50%);pointer-events:none}.controls{display:flex;gap:8px}.controls>*{min-width:0;flex:1}.secondary{background:#334155}.small{font-size:13px;color:#cbd5e1}#live[hidden],#pair[hidden]{display:none}#live{flex:1;display:flex;flex-direction:column;gap:10px}#status{min-height:40px;font-size:14px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}</style></head><body><main><h1>Камера для Mac</h1><p class="small">На этом экране видно, куда направлена камера. Вход в CRM не нужен.</p><form id="pair"><label for="code">Код с экрана Mac</label><input id="code" name="code" inputmode="numeric" pattern="[0-9 ]{8,9}" autocomplete="one-time-code" maxlength="9" placeholder="0000 0000" required><button type="submit">Подключить камеру</button></form><section id="live" hidden><div class="viewfinder"><video id="video" playsinline muted autoplay></video><div class="aim" aria-hidden="true"></div></div><p class="small">Наведите рамку на QR фотографии. Выбор услуги выполняется на Mac.</p><div class="controls"><select id="device" aria-label="Выбор камеры"></select><button type="button" class="secondary" id="stop">Остановить</button></div><button type="button" id="resume" hidden>Включить камеру снова</button></section><p id="status" role="status" aria-live="polite">Откройте «Камера телефона» в CRM на Mac, затем введите показанный код.</p></main><script type="module" src="/js/ui/phone-camera-sender.js?v=264"></script></body></html>
