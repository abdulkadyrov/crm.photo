<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Сканер печати</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font:16px system-ui,-apple-system,sans-serif}main{max-width:650px;min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}h1{font-size:22px;margin:0}p{margin:0;line-height:1.4}label{display:block;font-size:14px}input,button,select{font:inherit;border-radius:12px;min-height:46px;width:100%;padding:10px 12px}input,select{border:1px solid #64748b;background:#1e293b;color:#fff}button{border:0;background:#2563eb;color:#fff;font-weight:650;cursor:pointer}button:disabled{opacity:.55}form{display:grid;gap:10px}input{font-size:28px;text-align:center;letter-spacing:.15em}.viewfinder{position:relative;flex:1;min-height:280px;border-radius:14px;overflow:hidden;background:#020617}.viewfinder video{width:100%;height:100%;position:absolute;inset:0;object-fit:contain}.aim{position:absolute;width:64%;aspect-ratio:1;max-height:80%;border:2px solid #fff;border-radius:16px;left:18%;top:50%;transform:translateY(-50%);pointer-events:none}.controls{display:flex;gap:8px}.controls>*{min-width:0;flex:1}.secondary{background:#334155}.small{font-size:13px;color:#cbd5e1}#live[hidden],#pair[hidden]{display:none}#live{flex:1;display:flex;flex-direction:column;gap:10px}#status{min-height:40px;font-size:14px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}#picker[hidden]{display:none}#picker{background:#1e293b;border:1px solid #64748b;border-radius:12px;padding:10px}.picker-head{display:flex;justify-content:space-between;gap:8px;font-size:15px}.picker-head span{white-space:nowrap;font-size:13px}#works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}.work{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:13px}.work img{width:100%;height:92px;object-fit:contain;background:#0f172a;border-radius:8px}.work button{font-size:14px;min-height:44px;padding:8px}.work strong{overflow-wrap:anywhere}.work .selected{background:#166534}body.picking .viewfinder{min-height:200px;flex:0 0 200px}summary{font-size:13px;padding:6px 0;cursor:pointer}#manual{margin-top:8px}#manual input{font-size:16px;letter-spacing:normal;text-align:left}#next{background:#334155}#status{min-height:20px}.controls{flex-wrap:wrap}.controls #device{flex:1 1 110px}.controls button{flex:1 1 75px;font-size:13px}#pair input{letter-spacing:.12em}body.picking main>p.small{display:none}body.picking #works img{height:80px}</style></head><body><main><h1>Сканер печати</h1><p class="small">Сканируйте QR и выбирайте услуги здесь. Вход в CRM не нужен.</p><form id="pair"><label for="code">Код с экрана Mac</label><input id="code" name="code" inputmode="numeric" pattern="[0-9 ]{8,9}" autocomplete="one-time-code" maxlength="9" placeholder="0000 0000" required><button type="submit">Подключить камеру</button></form><section id="live" hidden><div class="viewfinder"><video id="video" playsinline muted autoplay></video><div class="aim" aria-hidden="true"></div></div><p class="small">Наведите рамку на QR фотографии. Коснитесь изображения для фокуса. Выбор сразу появится на Mac.</p><section id="picker" hidden aria-label="Выбор услуги"><div class="picker-head"><strong id="child"></strong><span id="count"></span></div><p id="group" class="small"></p><div id="works"></div></section><button id="next" type="button" class="secondary">Следующий QR</button><details><summary>Ввести код вручную</summary><form id="manual"><input name="code" aria-label="QR или штрихкод" placeholder="QR или штрихкод" required><button>Найти</button></form></details><div class="controls"><button id="sound" type="button" class="secondary" aria-pressed="true">Звук вкл.</button><select id="device" aria-label="Выбор камеры"></select><button type="button" class="secondary" id="stop">Стоп</button></div><button type="button" id="resume" hidden>Включить камеру снова</button></section><p id="status" role="status" aria-live="polite">Откройте «Камера телефона» в CRM на Mac, затем введите показанный код.</p></main><script src="/vendor/jsQR.js"></script><script type="module" src="/js/ui/phone-camera-sender.js?v=264"></script></body></html>
